<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="description" content="Evidence-first freelance time, approval and earnings tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeLedger">
<title>TimeLedger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/db.js">
<link rel="modulepreload" href="js/calc.js">
<link rel="modulepreload" href="js/tz.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/actions.js">
<link rel="modulepreload" href="js/views/dashboard.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body class="booting">
<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>TimeLedger</span></div>
    <nav id="nav" aria-label="Main"></nav>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <div class="topbar-row">
        <h1 id="page-title">Dashboard</h1>
        <label class="switcher-wrap"><span class="sr-only">Employer / contract</span><select id="switcher" aria-label="Employer or contract"></select></label>
      </div>
      <div class="topbar-row sub">
        <div id="clocks" class="clocks" aria-live="off"></div>
        <button id="timer-chip" class="timer-chip" type="button" hidden><span class="tc-dot"></span><span class="tc-time">00:00:00</span><span class="tc-label"></span></button>
      </div>
    </header>
    <main id="view" tabindex="-1"><div class="loading">Loading…</div></main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Quick navigation"></nav>
  <button id="fab" class="fab" type="button" aria-label="Quick add">+</button>
</div>
<div id="print-root" aria-hidden="true"></div>
</body>
</html>
